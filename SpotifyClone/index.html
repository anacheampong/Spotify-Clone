<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />

    <title>Document</title>
  </head>
  <body>
    <nav>
      <div class="left-half">
        <div class="logo"><i class="fa-brands fa-spotify"></i></div>
        <div class="home-icon"><i class="fa-regular fa-house"></i></div>
        <div class="search-bar">
          <div class="search-icon">
            <i class="fa-solid fa-magnifying-glass"></i>
          </div>
          <input
            type="text"
            class="input-box"
            placeholder="What do you want to play?"
          />
          <div class="browse"><i class="fa-solid fa-folder-open"></i></div>
        </div>
      </div>
      <div class="right-half">
        <div class="right-half-part1">
          <p class="nav-text">Premium</p>
          <p class="nav-text">Support</p>
          <p class="nav-text">Download</p>
        </div>
        <div class="right-half-part2">
          <div class="nav-text">
            <i class="fa-regular fa-circle-down"></i> Install App
          </div>
          <div class="sign-up nav-text">Sign Up</div>
          <button class="login-btn">Log in</button>
        </div>
      </div>
    </nav>
  </body>
</html>
